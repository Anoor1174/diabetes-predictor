<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Healthy Plate Challenge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='kids.css') }}">
</head>
<body>

<div class="kids-topbar">
    <a href="/" class="kids-back-link">← Back to main site</a>
</div>

<div class="kids-wrap">
    <h1 class="kids-title">🍎 Healthy Plate Challenge 🥦</h1>
    <p class="kids-subtitle">Tap the foods to fill your plate. Try to make it colourful and balanced!</p>

    <div class="kids-scoreboard">
        <div class="kids-score-chip">
            <span class="kids-score-label">Plate Points</span>
            <span class="kids-score-value" id="score">0</span>
        </div>
        <div class="kids-score-chip">
            <span class="kids-score-label">Foods on Plate</span>
            <span class="kids-score-value" id="plateCount">0 / 6</span>
        </div>
    </div>

    <div class="plate-area">
        <div class="plate" id="plate">
            <div class="plate-hint" id="plateHint">Your plate is empty — start tapping foods below!</div>
        </div>
    </div>

    <div id="feedback" class="kids-feedback"></div>

    <h2 class="kids-section-heading">Pick a food!</h2>
    <div class="food-grid" id="foodGrid"></div>

    <div id="badgeModal" class="badge-modal hidden">
        <div class="badge-card">
            <div class="badge-emoji" id="badgeEmoji">🏆</div>
            <h2 id="badgeTitle">Badge Unlocked!</h2>
            <p id="badgeText"></p>
            <button class="kids-btn" onclick="playAgain()">Play Again</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='kids.js') }}"></script>
</body>
</html>
